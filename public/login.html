<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-900">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar Sesión · Santa Cruz Noticias</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#fffbeb',
                100: '#fef3c7',
                500: '#d97706',
                600: '#b45309',
                700: '#92400e'
              }
            }
          }
        }
      };
    </script>
  </head>
  <body class="h-full flex items-center justify-center p-4 bg-gradient-to-br from-slate-950 via-slate-900 to-amber-950/20 text-slate-100 antialiased">
    <div class="w-full max-w-md">
      <!-- Marca / Encabezado -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-amber-500/10 border border-amber-500/20 shadow-lg shadow-amber-500/5 mb-4">
          <svg class="w-8 h-8 text-amber-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"></path>
            <path d="M18 14h-8"></path>
            <path d="M15 18h-5"></path>
            <path d="M10 6h8v4h-8V6Z"></path>
          </svg>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-white">Santa Cruz <span class="text-amber-500 italic">Noticias</span></h1>
        <p class="text-sm text-slate-400 mt-1">Panel de monitoreo y análisis informativo</p>
      </div>

      <!-- Tarjeta de Login -->
      <div class="bg-slate-900/90 backdrop-blur-xl border border-slate-800/80 rounded-2xl shadow-2xl p-7 sm:p-8">
        <h2 class="text-lg font-semibold text-white mb-2">Ingresar a tu cuenta</h2>
        <p class="text-xs text-slate-400 mb-6">Introduce tus credenciales para acceder al sistema.</p>

        <!-- Mensaje de error -->
        <div id="errorBox" class="hidden mb-5 p-3.5 rounded-xl bg-red-950/50 border border-red-800/50 text-red-300 text-xs flex items-start gap-3">
          <svg class="w-5 h-5 text-red-400 flex-shrink-0" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
          </svg>
          <span id="errorMessage" class="flex-1 leading-relaxed"></span>
        </div>

        <form id="loginForm" class="space-y-4" novalidate>
          <!-- Email -->
          <div>
            <label for="email" class="block text-xs font-medium text-slate-300 mb-1.5">Correo electrónico</label>
            <div class="relative">
              <input
                id="email"
                type="email"
                required
                autocomplete="email"
                placeholder="usuario@dominio.com"
                class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950/60 border border-slate-700/80 text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500 transition-all"
              />
            </div>
          </div>

          <!-- Contraseña -->
          <div>
            <label for="password" class="block text-xs font-medium text-slate-300 mb-1.5">Contraseña</label>
            <div class="relative">
              <input
                id="password"
                type="password"
                required
                autocomplete="current-password"
                placeholder="••••••••"
                class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950/60 border border-slate-700/80 text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/40 focus:border-amber-500 transition-all pr-10"
              />
              <button
                type="button"
                id="togglePassword"
                class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-200 transition-colors"
                aria-label="Mostrar u ocultar contraseña"
              >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Opciones adicionales -->
          <div class="flex items-center justify-between pt-1">
            <label class="flex items-center gap-2 cursor-pointer">
              <input
                id="remember"
                type="checkbox"
                checked
                class="w-4 h-4 rounded bg-slate-950 border-slate-700 text-amber-500 focus:ring-amber-500/40 focus:ring-offset-slate-900"
              />
              <span class="text-xs text-slate-400 select-none">Recordar sesión</span>
            </label>
          </div>

          <!-- Botón Enviar -->
          <button
            type="submit"
            id="submitBtn"
            class="w-full mt-2 py-2.5 px-4 rounded-xl font-medium text-sm text-slate-950 bg-amber-500 hover:bg-amber-400 active:bg-amber-600 focus:outline-none focus:ring-2 focus:ring-amber-500/50 shadow-lg shadow-amber-500/20 transition-all flex items-center justify-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed cursor-pointer"
          >
            <!-- Spinner -->
            <svg id="btnSpinner" class="hidden animate-spin h-4 w-4 text-slate-950" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span id="btnText">Iniciar Sesión</span>
          </button>
        </form>
      </div>

      <!-- Pie de página -->
      <p class="text-center text-xs text-slate-500 mt-6">
        Acceso restringido para personal autorizado · Santa Cruz, Argentina
      </p>
    </div>

    <!-- Script de autenticación modular -->
    <script type="module" src="js/login.js"></script>
  </body>
</html>
